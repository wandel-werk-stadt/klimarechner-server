proxy_cache_path /var/run/nginx-cache/jscache levels=1:2 keys_zone=jscache:100m inactive=30d use_temp_path=off max_size=100m;

server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    # rewrite_log on;

    root /srv/website;

    # disable index
    # index X6XewZMsmreGIgggp0Yo1X4qHTivW;
    index index.html index.htm index.nginx-debian.html;

    charset UTF-8;

    # access_log  /var/log/nginx/host.access.log main;
    # error_log /var/log/nginx/host.error.log notice;

    location = /plio/js/script.js {
        proxy_pass https://plausible.io/js/plausible.outbound-links.js;

        # Tiny, negligible performance improvement. Very optional.
        proxy_buffering on;

        # Cache the script for 6 hours, as long as plausible.io returns a valid response
        proxy_cache jscache;
        proxy_cache_valid 200 6h;
        proxy_cache_use_stale updating error timeout invalid_header http_500;

        # Optional. Adds a header to tell if you got a cache hit or miss
        add_header X-Cache $upstream_cache_status;
    }

    location = /plio/api/event {
        limit_except POST {
            deny all;
        }

        proxy_pass https://plausible.io/api/event;
        proxy_buffering on;
        proxy_http_version 1.1;

        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
    }

    # redirect /foobar/ to /foobar
    # rewrite ^(.+)/+$ https://$http_host$1 permanent;
    # rewrite ^(.*)/index.html$ https://$http_host$1 permanent;

    # static files served by nginx
    location ~* \.(jpg|jpeg|gif|png|svg|webp|ico|scss|css|js|mjs|json|xml|txt|woff|woff2|wasm)$ {
        gzip_static on;

        expires max;

        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page  404              /404;
    # location = /404.html {
    #     root   /app/dist-live/client;
    # }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    # location = /50x.html {
    #     root   /usr/share/nginx/html;
    # }
}
